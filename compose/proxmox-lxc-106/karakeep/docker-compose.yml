# Karakeep - LXC 106 (192.168.0.128)
#
# 2026-08-13-ig community-script telepítés volt (/opt/karakeep, pnpm build,
# systemd unitok). A frissítés forrásból épült újra minden alkalommal, egy
# Node-verzió workaroundon egyensúlyozva - ezért lett compose.
#
# Az adat NEM költözött: a /opt/karakeep_data bind mountként megy tovább,
# ugyanaz a db.db és assets/ mappa, mint a régi telepítésnél.
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep-web
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /opt/karakeep_data:/data
    environment:
      DATA_DIR: /data
      NEXTAUTH_URL: http://192.168.0.128:3000
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DB_WAL_MODE: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # AI: Gemini az OpenAI-kompatibilis végpontján (2026-08-13-tól, előtte Ollama)
      OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INFERENCE_TEXT_MODEL: gemini-3.5-flash-lite
      INFERENCE_IMAGE_MODEL: gemini-3.5-flash-lite
      INFERENCE_MAX_OUTPUT_TOKENS: 2048
      INFERENCE_CONTEXT_LENGTH: 8000
      INFERENCE_NUM_WORKERS: 3
      INFERENCE_JOB_TIMEOUT_SEC: 60
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
      # Szemantikus keresés: 0.33.1-től van, a régi forrás-telepítés nem tudta.
      EMBEDDING_TEXT_MODEL: gemini-embedding-2
      EMBEDDING_DIMENSIONS: 3072
      EMBEDDING_ENABLE_AUTO_INDEXING: "true"
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      # A Meilisearch tagje szándékosan fix: major verzióváltásnál az index
      # formátuma inkompatibilis lesz, és egy automata frissítés csendben
      # elvinné a keresést. Ezt kézzel, tudatosan kell lépni.
      - meilisearch:/meili_data

volumes:
  meilisearch:
