# Karakeep - LXC 106 (192.168.0.128)
#
# Until 2026-08-13 this was a community-script install (/opt/karakeep, pnpm build,
# systemd units). Every upgrade rebuilt it from source, balancing on a Node version
# workaround - which is why it became compose.
#
# The data did NOT move: /opt/karakeep_data carries on as a bind mount, the same
# db.db and assets/ directory as in the old install.
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep-web
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /opt/karakeep_data:/data
    environment:
      DATA_DIR: /data
      NEXTAUTH_URL: http://192.168.0.128:3000
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DB_WAL_MODE: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # AI: Gemini on its OpenAI-compatible endpoint (since 2026-08-13, Ollama before that)
      OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INFERENCE_TEXT_MODEL: gemini-3.5-flash-lite
      INFERENCE_IMAGE_MODEL: gemini-3.5-flash-lite
      INFERENCE_MAX_OUTPUT_TOKENS: 2048
      INFERENCE_CONTEXT_LENGTH: 8000
      INFERENCE_NUM_WORKERS: 3
      INFERENCE_JOB_TIMEOUT_SEC: 60
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
      # Semantic search: available from 0.33.1, the old source install could not do it.
      EMBEDDING_TEXT_MODEL: gemini-embedding-2
      EMBEDDING_DIMENSIONS: 3072
      EMBEDDING_ENABLE_AUTO_INDEXING: "true"
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      # The Meilisearch tag is deliberately pinned: on a major version change the
      # index format becomes incompatible, and an automatic update would silently
      # take search down. That step has to be taken by hand, deliberately.
      - meilisearch:/meili_data

volumes:
  meilisearch:
