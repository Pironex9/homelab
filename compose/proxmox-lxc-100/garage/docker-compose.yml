services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    hostname: garage
    environment:
      # Komodo Stack Environment / .env - soha nem a repoban
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /srv/docker-data/garage/meta:/var/lib/garage/meta
      - /mnt/storage/backup/garage:/var/lib/garage/data
    ports:
      # csak az S3 API; a 3901 (RPC) es a 3903 (admin) a konteneren belul marad,
      # a garage CLI-t docker exec-cel hasznaljuk
      - 3900:3900
    restart: unless-stopped
    networks:
      - utils
networks:
  utils:
    external: true
