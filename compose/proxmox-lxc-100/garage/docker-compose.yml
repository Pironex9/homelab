services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    hostname: garage
    environment:
      # Komodo Stack Environment / .env - never in the repo
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /srv/docker-data/garage/meta:/var/lib/garage/meta
      - /mnt/storage/backup/garage:/var/lib/garage/data
    ports:
      # only the S3 API; 3901 (RPC) and 3903 (admin) stay inside the container,
      # the garage CLI is used through docker exec
      - 3900:3900
    restart: unless-stopped
    networks:
      - utils
networks:
  utils:
    external: true
