metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

# Egyetlen node, nincs redundancia. A Garage doksi ezt "csak tesztre" minositi,
# de itt a tartalom maga is masolat (Longhorn kotetek mentese), es a
# /mnt/storage-t SnapRAID vedi lemezvesztes ellen.
replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret es admin_token: GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN kornyezeti valtozobol

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
