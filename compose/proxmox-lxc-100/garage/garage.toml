metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

# A single node, no redundancy. The Garage docs call this "test only", but here the
# content is itself a copy (backups of Longhorn volumes), and /mnt/storage is
# protected against disk loss by SnapRAID.
replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret and admin_token: from the GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN environment variables

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
