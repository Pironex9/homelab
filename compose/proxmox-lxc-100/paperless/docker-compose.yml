# Paperless-ngx plus the scan side for the HP Smart Tank 750 (192.168.0.43).
#
# The printer has no scan-to-folder: its web interface exposes eSCL but no
# network-folder or FTP destination, so a scan cannot be pushed from the
# device. scanservjs pulls it over eSCL instead and writes the PDF straight
# into the Paperless consume directory.
#
# The ADF is single-sided (eSCL advertises AdfSimplexInputCaps only), so
# double-sided paper uses scanservjs's "auto collate" batch mode: fronts,
# flip the stack, backs, merged into one PDF.
#
# Printing needs no service here: the printer accepts no PDF over IPP
# (pdf-versions-supported = none), but the Paperless print button hands the
# document to the browser, and the client OS rasterises it for the printer.
services:
  paperless-broker:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA}/paperless/redis:/data
    networks:
      - arr_stack

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-broker
    ports:
      - 8000:8000
    # ponytail: SQLite, the documented default; Postgres when several people
    # write at once or the archive reaches tens of thousands of documents.
    volumes:
      - ${DOCKER_DATA}/paperless/data:/usr/src/paperless/data
      - ${DOCKER_DATA}/paperless/media:/usr/src/paperless/media
      - ${DOCKER_DATA}/paperless/export:/usr/src/paperless/export
      - ${DOCKER_DATA}/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      # Behind Caddy on https the login POST is rejected as cross-origin
      # (measured: 403) until the https origin is trusted. Not PAPERLESS_URL:
      # that also narrows ALLOWED_HOSTS and would lock out 192.168.0.110:8000.
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.lan
      # Creates the superuser on first start only; ignored once it exists.
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      # hun and slk are not in the image, the container installs them at start.
      PAPERLESS_OCR_LANGUAGES: hun slk
      PAPERLESS_OCR_LANGUAGE: hun+slk
      # Default DMY turns Hungarian 2026.08.01 and ISO dates into 2026-01-08.
      # YMD reads every 4-digit-year form in both languages correctly and only
      # misreads 2-digit-year day-first dates (15.09.26 -> 2015-09-26).
      PAPERLESS_DATE_ORDER: YMD
      # AI features on the Nobara desktop's Ollama (RTX 2060 SUPER, 8 GB).
      # Manual use only (Suggest button, chat): no "Apply AI Suggestions"
      # workflow, because that desktop is off or booted to Windows part of
      # the day, and its VRAM is shared with Immich ML and games. OCR, search
      # and the classic suggestions never touch it and keep working without it.
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_ENDPOINT: http://192.168.0.100:11434
      PAPERLESS_AI_LLM_MODEL: qwen3:8b-nothink
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: nomic-embed-text
      # The index refresh defaults to 02:10, when the desktop is usually off.
      PAPERLESS_LLM_INDEX_TASK_CRON: "30 20 * * *"
    networks:
      - arr_stack

  scanservjs:
    image: sbs20/scanservjs:v3.3.0
    container_name: scanservjs
    restart: unless-stopped
    ports:
      - 8086:8080
    environment:
      # Trailing colon: search sane/ first, then the image's /etc/sane.d.
      # Why the device is not in AIRSCAN_DEVICES: see sane/airscan.conf.
      SANE_CONFIG_DIR: "/etc/sane-extra:"
    volumes:
      - ./sane:/etc/sane-extra:ro
      # The directory, not the single file: a file bind mount pins the inode,
      # and a git pull writes a new one, so the container kept the old config
      # (measured: repo had the change, the container did not).
      - ./scanservjs:/etc/scanservjs:ro
      - ${DOCKER_DATA}/paperless/consume:/var/lib/scanservjs/output
    networks:
      - arr_stack

networks:
  arr_stack:
    external: true
