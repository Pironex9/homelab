# Loaded through SANE_CONFIG_DIR ahead of the image's own /etc/sane.d.
#
# discovery = disable is the whole reason this file exists. The container
# runs no avahi daemon, and with discovery on, sane-airscan returned an
# empty device list - the manually listed printer included (measured:
# `scanimage -L` found nothing until discovery was switched off).
# AIRSCAN_DEVICES in the image cannot set it: its entrypoint only appends
# lines under [devices].
[devices]
"HP Smart Tank 750" = http://192.168.0.53/eSCL, eSCL

[options]
discovery = disable
