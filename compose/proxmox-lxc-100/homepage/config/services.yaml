- K3s:
    # The five web UIs on the 3-node K3s cluster, all behind a Tailscale Ingress.
    # The `href` is a tailnet name: it only opens from a tailnet device, not from the
    # LAN - that is deliberate, not a fault. `siteMonitor` is the same name, and the
    # homepage container resolves it through `extra_hosts` (see the compose file).
    - Argo CD:
        icon: argo-cd.png
        href: https://argocd.tailc6abe2.ts.net
        description: GitOps for the cluster contents (app-of-apps)
        siteMonitor: https://argocd.tailc6abe2.ts.net
        statusStyle: dot
    - Longhorn:
        icon: longhorn.png
        href: https://longhorn.tailc6abe2.ts.net
        description: Distributed block storage - volumes, replicas, backups
        siteMonitor: https://longhorn.tailc6abe2.ts.net
        statusStyle: dot
    - Grafana:
        icon: grafana.png
        href: https://grafana.tailc6abe2.ts.net
        description: kube-prometheus-stack dashboards
        siteMonitor: https://grafana.tailc6abe2.ts.net
        statusStyle: dot
    - Forgejo:
        icon: forgejo.png
        href: https://forgejo.tailc6abe2.ts.net
        description: Git hosting - first workload on a Longhorn volume
        siteMonitor: https://forgejo.tailc6abe2.ts.net
        statusStyle: dot
    # gethomepage has no umami widget (159 widgets in v1.13, none for umami,
    # plausible or matomo), so this is a link entry like the four above rather
    # than a deliberate omission of a stats block.
    - Umami:
        # The only `-light` icon on the dashboard. The other four K3s marks are
        # coloured and read on any background; plain `umami.png` is a solid black
        # circle that all but disappears on this dark theme.
        icon: umami-light.png
        href: https://umami.tailc6abe2.ts.net
        description: Web analytics for homelabor.net - dashboard only, the tracker is public
        siteMonitor: https://umami.tailc6abe2.ts.net
        statusStyle: dot

