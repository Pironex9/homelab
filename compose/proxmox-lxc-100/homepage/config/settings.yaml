---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Proxmox Home Page

headerStyle: boxed
fullWidth: true
useEqualHeights: true
hideVersion: true

# No cardBlur: per-card backdrop-blur flickers on repaint. The background
# itself is dimmed instead, which the two settings cannot both do at once.
background:
  image: https://www.traveltalktours.com/wp-content/smush-webp/2024/04/Best-Places-for-Cherry-Blossoms-in-Japan-1536x1024.jpg.webp
  blur: sm
  saturate: 50
  brightness: 40
  opacity: 40

theme: dark
color: slate

layout:
  Quick Links:
    tab: Home
    style: row
    columns: 8
    iconsOnly: true
  Monitoring:
    tab: Home
    icon: mdi-heart-pulse
    style: row
    columns: 6
  Infrastructure:
    tab: Home
    icon: mdi-server
    style: row
    columns: 5

  Arr Stack:
    tab: Media
    icon: mdi-download
    style: row
    columns: 6
  Media:
    tab: Media
    icon: mdi-play-circle
    style: row
    columns: 5
  Calendar:
    tab: Media
    icon: mdi-calendar
    style: row
    columns: 2

  Automation:
    tab: Lab
    icon: mdi-robot
    style: row
    columns: 7
  Utilities:
    tab: Lab
    icon: mdi-tools
    style: row
    columns: 6
  Network:
    tab: Lab
    icon: mdi-lan
    style: row
    columns: 3
  Productivity:
    tab: Lab
    icon: mdi-clipboard-check-outline
    style: row
    columns: 4
  Uzlet:
    tab: Lab
    icon: mdi-chart-line
    style: row
    columns: 3
    iconsOnly: true
