---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Proxmox Home Page

headerStyle: boxed
fullWidth: true
useEqualHeights: true
hideVersion: true

# Served from /srv/docker-data/homepage/images -> /app/public/images, the same
# runtime mount the service icons use. It was a hotlink to a travel site until
# that site moved off WordPress and took its whole /wp-content tree with it:
# the URL began returning a real 404 and the dashboard lost its background on
# every device that had not cached the file. A dashboard on the LAN has no
# business depending on a third party's URL structure.
background:
  image: /images/background.webp
  blur: ""
  saturate: 60 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
  brightness: 50 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
  opacity: 60 # 0-100

theme: dark
color: slate

# Every group's `columns` equals its item count, so no row is ever partially
# filled. The `Links` groups carry `header: false` so they attach visually to
# the widget group above them instead of reading as separate sections.
layout:
  Quick Links:
    icon: mdi-link-variant
    style: row
    columns: 9
    iconsOnly: true

  # Links groups are nested under their parent (not sibling top-level groups)
  # so collapsing the parent's header collapses both rows together. A nested
  # group renders inside a 1-column wrapper regardless of the parent's own
  # `columns`, so the wrapper width is forced full-bleed in custom.css
  # (`.subgroup { grid-column: 1 / -1; }`) - otherwise a single subgroup would
  # be squeezed into 1/N of the row.
  Status:
    icon: mdi-heart-pulse
    style: row
    columns: 4
    Status Links:
      header: false
      style: row
      columns: 6

  Core:
    icon: mdi-server
    style: row
    columns: 3
    Core Links:
      header: false
      style: row
      columns: 6

  # Four services and no Links strip below it: this is the cluster's entire web
  # surface. `columns: 4` = the item count, as in every other group.
  K3s:
    icon: mdi-kubernetes
    style: row
    columns: 4

  Media:
    icon: mdi-play-circle
    style: row
    columns: 6
    Media Links:
      header: false
      style: row
      columns: 5

  Utilities:
    icon: mdi-tools
    style: row
    columns: 6
    Utilities Links:
      header: false
      style: row
      columns: 3

  # `columns` has no effect on a group holding a single widget-only service -
  # this renders as lg:grid-cols-1 whatever is set here, verified in the DOM.
  # The calendar's width is capped in custom.css instead.
  Calendar:
    icon: mdi-calendar
    style: row
    columns: 1
