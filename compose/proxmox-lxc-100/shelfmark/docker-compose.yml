services:
  shelfmark:
    # Shelfmark: the successor of calibre-web-automated-book-downloader (the project
    # was renamed in 2026). A book and audiobook search plus download manager that
    # drops its results straight into the CWA ingest directory.
    # The standard image starts a real Chromium to solve the Cloudflare challenge,
    # hence mem_limit: without it a stuck browser would eat the host's free RAM away
    # from the other 32 containers.
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Budapest
      - INGEST_DIR=/books
    volumes:
      - /srv/docker-data/shelfmark:/config
      # CWA's inotify-watched ingest directory: whatever lands here is imported by
      # Calibre-Web on its own. PUID=0, because CWA also moves and deletes files here as root.
      - /mnt/storage/media/konyv_ingest:/books
      # qBittorrent's download directory, at EXACTLY the same path qBittorrent sees
      # it (Session\DefaultSavePath=/downloads). qBittorrent reports a finished torrent
      # by full path; if that path differed here, Shelfmark would not find the file and
      # the import would silently be skipped.
      - /mnt/storage/media/downloads:/downloads
    ports:
      - 8084:8084
    mem_limit: 2g
    restart: unless-stopped
