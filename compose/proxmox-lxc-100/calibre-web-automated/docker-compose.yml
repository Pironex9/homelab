services:
  calibre-web-automated:
    # Calibre-Web-NextGen: the community fork of CWA. The last upstream CWA release
    # was v4.0.6 (2026-02-04) and there has been no release since. Pinned to a digest,
    # because the fork moves fast - :latest would pull in new builds unreviewed.
    # v4.1.39, SLSA provenance verified: build .../docker-image-build-release.yml
    #   @refs/tags/v4.1.39, source commit d59d00fd16a65205aaeaf9af648a0bddd0e75e09
    # Roll back to: crocodilestick/calibre-web-automated@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
    image: ghcr.io/new-usemame/calibre-web-nextgen@sha256:4826c217a5167655ea5efa32c13a6e40c2f36d5563e7155ef5631ca55ee094b8
    container_name: calibre-web-automated
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Budapest
    volumes:
      - /srv/docker-data/calibrewebauto:/config
      - /mnt/storage/media/konyv_ingest:/cwa-book-ingest
      - /mnt/storage/media/konyvek:/calibre-library
    ports:
      - 8085:8083
    restart: unless-stopped
networks:
  arr_stack:
    external: true
  utils:
    external: true
