{% extends "base.html" %}
{% block title %}{{ S["login_title"] }} · {{ S["app_name"] }}{% endblock %}
{% block body_class %}is-login{% endblock %}
{% block body %}
<main>
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1 class="login-title">{{ S["app_name"] }}</h1>
  <p class="login-sub">{{ S["login_title"] }}</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form class="form" method="post" action="/login">
    <label for="username">{{ S["login_user"] }}</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="none" autocorrect="off" required autofocus>
    <label for="password">{{ S["login_password"] }}</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button class="btn" type="submit">{{ S["login_submit"] }}</button>
  </form>
</main>
{% endblock %}
