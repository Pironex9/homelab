# Source of truth for the topology map. Edit, then `npm run build`.
sites:
  - id: lan
    label: "SITE A / HOME LAN"
    subnet: "192.168.0.0/24"
  - id: remote
    label: "SITE B / K3S CLUSTER"
    subnet: "192.168.2.0/24"
    link: "Tailscale mesh"

kinds:
  hypervisor: { label: "Hypervisor", color: "#e8a04c" }
  lxc: { label: "LXC container", color: "#5cc8ff" }
  vm: { label: "Virtual machine", color: "#b18aff" }
  k3s: { label: "K3s node", color: "#6ee7a0" }

nodes:
  - badge: "PVE"
    name: pve
    site: lan
    head: true
    kind: hypervisor
    ip: 192.168.0.109
    role: "Proxmox VE 9.1"
    hw: "HP EliteDesk 800 G4"
    detail: "Hypervisor running every LXC and VM below. Storage: MergerFS 8.1 TB + SnapRAID over 4 USB HDDs. Backups via Restic (local + NFS)."

  - badge: "LXC 100"
    name: docker-host
    site: lan
    kind: lxc
    ip: 192.168.0.110
    role: "Docker host"
    detail: "22 Docker Compose stacks: Jellyfin + *arr media stack, Immich, Syncthing, static sites and more. Deployed from git via Komodo GitOps."

  - badge: "VM 101"
    name: haos
    site: lan
    kind: vm
    ip: 192.168.0.202
    role: "Home Assistant OS"
    detail: "Smart home hub with Zigbee2MQTT and automations."

  - badge: "LXC 102"
    name: adguard
    site: lan
    kind: lxc
    ip: 192.168.0.111
    role: "DNS"
    detail: "AdGuard Home - LAN-wide DNS with ad blocking and *.lan rewrites pointing at the Caddy proxy."

  - badge: "LXC 103"
    name: vaultwarden
    site: lan
    kind: lxc
    ip: 192.168.0.219
    role: "Password manager"
    detail: "Vaultwarden. Alpine community-script container, managed via pct exec only - no SSH."

  - badge: "LXC 105"
    name: komodo
    site: lan
    kind: lxc
    ip: 192.168.0.105
    role: "GitOps deploy"
    detail: "Komodo (port 9120) - pulls this repo and deploys the Docker stacks on LXC 100."

  - badge: "LXC 106"
    name: karakeep
    site: lan
    kind: lxc
    ip: 192.168.0.128
    role: "Bookmarks"
    detail: "Karakeep bookmark manager with AI tagging backed by Ollama."

  - badge: "LXC 107"
    name: n8n
    site: lan
