services:
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich_db
    shm_size: 1gb
    volumes:
      - ${DOCKER_DATA}/dawarich-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dawarich
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawarich"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - dawarich

  dawarich_redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    command: redis-server --save 900 1 --save 300 10
    volumes:
      - ${DOCKER_DATA}/dawarich-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - dawarich

  dawarich_app:
    image: freikin/dawarich:latest
    container_name: dawarich_app
    # web-entrypoint.sh runs db:migrate, data:migrate and db:seed before execing
    # the command, so a new image can never boot against an older schema. Without
    # it the image's default entrypoint is a bare `bundle exec` and migrations
    # never run - see the doc, 18 of them silently piled up.
    entrypoint: web-entrypoint.sh
    command: "bin/rails server -p 3000 -b ::"
    volumes:
      - ${DOCKER_DATA}/dawarich-public:/var/app/public
      - ${DOCKER_DATA}/dawarich-storage:/var/app/storage
      - ${DOCKER_DATA}/dawarich-imports:/var/app/tmp/imports
      - ${DOCKER_DATA}/dawarich-watched:/var/app/tmp/watched
    ports:
      - "3005:3000"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: dawarich
      REDIS_URL: redis://dawarich_redis:6379/0
      TIME_ZONE: ${TZ}
      APPLICATION_HOSTS: 192.168.0.110,localhost,dawarich.homelabor.net,dawarich.lan
      APPLICATION_PROTOCOL: http
      BACKGROUND_PROCESSING_CONCURRENCY: 5
      SELF_HOSTED: "true"
      DOMAIN: dawarich.homelabor.net
      SMTP_SERVER: smtp.resend.com
      SMTP_PORT: 587
      SMTP_DOMAIN: ${DAWARICH_SMTP_DOMAIN}
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${DAWARICH_SMTP_PASSWORD}
      SMTP_FROM: ${DAWARICH_SMTP_FROM}
      SMTP_STARTTLS: "true"
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      retries: 3
      start_period: 180s   # migrations now run before Puma boots
    networks:
      - dawarich
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  dawarich_sidekiq:
    image: freikin/dawarich:latest
    container_name: dawarich_sidekiq
    entrypoint: sidekiq-entrypoint.sh
    command: sidekiq
    volumes:
      - ${DOCKER_DATA}/dawarich-public:/var/app/public
      - ${DOCKER_DATA}/dawarich-storage:/var/app/storage
      - ${DOCKER_DATA}/dawarich-imports:/var/app/tmp/imports
      - ${DOCKER_DATA}/dawarich-watched:/var/app/tmp/watched
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: dawarich
      REDIS_URL: redis://dawarich_redis:6379/0
      TIME_ZONE: ${TZ}
      BACKGROUND_PROCESSING_CONCURRENCY: 5
      SELF_HOSTED: "true"
      DOMAIN: dawarich.homelabor.net
      SMTP_SERVER: smtp.resend.com
      SMTP_PORT: 587
      SMTP_DOMAIN: ${DAWARICH_SMTP_DOMAIN}
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${DAWARICH_SMTP_PASSWORD}
      SMTP_FROM: ${DAWARICH_SMTP_FROM}
      SMTP_STARTTLS: "true"
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dawarich
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  dawarich:
    driver: bridge
