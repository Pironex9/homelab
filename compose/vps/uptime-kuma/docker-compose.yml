services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    environment:
      - TZ=Europe/Budapest
    volumes:
      - /opt/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host
    extra_hosts:
      # MagicDNS is off on this VPS, but the code-server monitor needs the
      # tailnet hostname: Tailscale Serve rejects a plain-IP HTTPS request (SNI)
      - "claude-mgmt.tailc6abe2.ts.net:100.98.146.14"
    restart: unless-stopped
