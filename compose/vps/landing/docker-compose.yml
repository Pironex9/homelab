services:
  landing:
    image: caddy:alpine
    container_name: landing
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/usr/share/caddy:ro
    # Tailscale runs on the VPS host, not in this container, and the host has
    # accept-dns=false - so MagicDNS names do not resolve here. The address is
    # the tailnet IP of the proxy device the Tailscale operator created for the
    # umami Ingress in the K3s cluster. Reaching it from this bridge network is
    # measured, not assumed: an alpine/curl container on `pangolin` got HTTP 200
    # from /api/heartbeat on 2026-08-31.
    #
    # The name is mapped rather than used raw in the Caddyfile so that TLS
    # verification and SNI still work against the Let's Encrypt certificate the
    # Tailscale proxy holds.
    #
    # WHAT INVALIDATES THIS: deleting and re-creating the umami Ingress makes the
    # operator register a NEW tailnet device with a NEW address. The symptom is
    # every tracker request timing out while the dashboard still works. Re-read
    # it with `tailscale status | grep umami`.
    extra_hosts:
      - "umami.tailc6abe2.ts.net:100.112.103.40"

    networks:
      pangolin:
        ipv4_address: 172.18.0.10
    restart: unless-stopped

# Joining the existing pangolin network is load-bearing, not cosmetic.
# UFW on this host permits port 3001 only from 172.18.0.0/16, so a container
# on its own network could not reach Uptime Kuma. It also means no host port
# is published on the public gateway. The address is static because Pangolin
# addresses resource targets by IP.
networks:
  pangolin:
    external: true
