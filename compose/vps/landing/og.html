<!doctype html>
<!--
  Generator for src/og.png, the Open Graph share card. NOT part of the site:
  it lives here rather than in src/ because build.sh copies src/ wholesale
  into a public web root, and the generator has no business being served.

  Regenerate. Must be served over HTTP: og.html now carries @font-face rules,
  and Chrome restricts font loads for the local-disk scheme, silently, so the
  card would render in a fallback face and look fine.

    (from the repo root)
    python3 -m http.server 8901 &
    sleep 2
    google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
      --run-all-compositor-stages-before-draw \
      --screenshot=compose/vps/landing/src/og.png \
      --window-size=1200,630 --virtual-time-budget=9000 \
      http://127.0.0.1:8901/compose/vps/landing/og.html
    pkill -f "http.server 8901"

  The two figures come from the same nodes.yml that generates topology.png,
  and the figcaption on the page repeats them in words. If a host is added or
  removed, all three move together: rebuild the topology map, re-export
  topology.png, rerun the command above, and fix the figcaption.

  Still self-contained in the sense that matters: no shared stylesheet, so the
  card keeps rendering identically even if style.css moves on. The exception is
  the three @font-face rules below, which reach into brand/ because that holds
  the only committed copy of each face and a stale .woff2 is invisible in a
  diff. That is the exception ADR 0002 already carves out for binaries. The
  values below are copied from style.css, not imported.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>homelabor.net Open Graph card</title>
<style>
  /* Rendered over HTTP, not file:// - see the command in README.md. Chrome
     restricts font loads under file://, and the failure is silent: the card
     renders in a fallback face and looks perfectly fine while being wrong.
     This file had no subresource at all before these three rules, which is
     why the old command needed no server.

     Paths are relative to the repository root, which is what the render
     command serves. */
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("../../../brand/ibm-plex-sans-var.woff2") format("woff2");
    font-weight: 100 700;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../../../brand/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../../../brand/ibm-plex-mono-500.woff2") format("woff2");
    font-weight: 500;
  }
  :root {
    --bg:        #0b0e13;
    --surface:   #12161d;
    --line:      #232a35;
    --ink:       #e9edf2;
    --ink-2:     #a2adbb;
    --ink-3:     #7d8898;
    --accent:    #e8933f;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 62px 72px 54px;
    background:
      radial-gradient(74% 104% at 2% -18%, rgba(232, 147, 63, 0.20), transparent 58%),
      radial-gradient(58% 86% at 104% 112%, rgba(232, 147, 63, 0.10), transparent 58%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Hairline frame, echoing the 1px borders every surface on the page uses.
     Inset so the card still reads as a card when a client rounds its corners. */
  .frame {
    position: fixed;
    inset: 22px;
    border: 1px solid var(--line);
    border-radius: 6px;
    pointer-events: none;
  }

  .kicker {
    font: 500 17px/1 var(--mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin-top: 30px;
    max-width: 15ch;
    font-size: 74px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.03;
  }

  .lede {
    margin-top: 26px;
    max-width: 58ch;
    font-size: 23px;
    line-height: 1.55;
    color: var(--ink-2);
  }

  /* Mirrors the hero readout: figures behind a vertical rule, mono, tabular. */
  .foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  /* The tools row from the page, flattened to one line. Fills the middle band
     and says what the stack is without another sentence of prose. */
  .strip {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 0;
    margin-top: 42px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font: 400 17px/1 var(--mono);
    letter-spacing: 0.02em;
    color: var(--ink-3);
  }

  .strip span + span::before {
    content: "/";
    margin: 0 13px;
    color: #2c3441;
  }

  .marks {
    font: 500 19px/1.7 var(--mono);
    letter-spacing: 0.03em;
    color: var(--ink-3);
  }

  .marks b { color: var(--ink); font-weight: 500; }

  .marks-row { display: flex; align-items: center; gap: 18px; }
  .mark { width: 54px; height: 54px; flex: none; }

  .stats { display: flex; gap: 54px; }

  .stat { padding-left: 26px; border-left: 1px solid var(--line); }

  .figure {
    display: block;
    font-family: var(--mono);
    font-size: 54px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
  }

  .label {
    display: block;
    margin-top: 11px;
    font: 500 14px/1.3 var(--mono);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
</style>
</head>
<body>
  <div class="frame"></div>

  <div>
    <p class="kicker">Norbert Csicsay</p>
    <h1>A homelab run like production.</h1>
    <!-- Kept word for word in step with og:description in src/index.html, so
         the card and the text preview beside it do not tell two stories. -->
    <p class="lede">
      Proxmox VE, GitOps-deployed containers, parity-protected storage and
      self-hosted public access. Documented as it was built.
    </p>
    <p class="strip">
      <span>Proxmox VE</span><span>Docker</span><span>Komodo</span><span>MergerFS + SnapRAID</span><span>Restic</span><span>Pangolin</span><span>Tailscale</span>
    </p>
  </div>

  <div class="foot">
    <div class="marks-row">
      <!-- The Mark, inlined from brand/mark-large.svg. Copy it verbatim when
           that file changes; nothing enforces it, and a stale copy here shows
           up only on a share card nobody looks at twice. -->
      <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="homelabor.net">
        <rect width="64" height="64" rx="12" fill="#0b0e13"/>
        <path d="M32 25v11M17 36v-5h30v5" fill="none" stroke="#3a4351" stroke-width="2.4" stroke-linecap="square"/>
        <rect x="19" y="10" width="26" height="15" rx="3" fill="#e8933f"/>
        <rect x="8" y="38" width="18" height="16" rx="3" fill="#a2adbb"/>
        <rect x="38" y="38" width="18" height="16" rx="3" fill="#a2adbb"/>
      </svg>
      <p class="marks"><b>homelabor.net</b><br>docs.homelabor.net</p>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="figure">15</span>
        <span class="label">Nodes</span>
      </div>
      <div class="stat">
        <span class="figure">2</span>
        <span class="label">Sites</span>
      </div>
    </div>
  </div>
</body>
</html>
