[defaults]
inventory = ./inventory.yml
nocows = True
deprecation_warnings = False
callbacks_enabled = profile_tasks
remote_tmp = $HOME/.ansible/tmp

# The node names resolve to Tailscale IPs from /etc/hosts on 109, not to the LAN
# addresses. That is why this inventory survives the next subnet change as well.
host_key_checking = True

[privilege_escalation]
become = True
