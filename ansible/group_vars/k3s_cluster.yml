---
# A description of the already running cluster. This is NOT a plan for a new
# install - the goal is that a `--check` run produces an empty diff against the
# current state.

ansible_user: nex
ansible_port: 22

# The currently installed version. DO NOT edit this to upgrade: raising
# k3s_version in site.yml is not a supported in-place upgrade path.
#
# Upgrades are done by the system-upgrade-controller, from the Plans in
# k8s/manifests/system-upgrade/, through ArgoCD. This variable describes what IS
# INSTALLED, and has to be carried over here by hand after an upgrade - otherwise
# the next site.yml run would downgrade the cluster to this version.
#
# 2026-08-28: v1.34.5 -> v1.34.11 -> v1.35.8 -> v1.36.4, in three SUC hops.
k3s_version: v1.36.4+k3s1

api_endpoint: 192.168.1.101
api_port: 6443

# The already existing token of the cluster. The file lives OUTSIDE the repo, and
# must never be committed.
token: "{{ lookup('file', '/root/.secrets/k3s-token') }}"

# The nodes run neither ufw nor firewalld (verified 2026-08-24). The collection
# would default to `true`, which would start adding firewall rules on a machine
# that has no firewall - hence it is turned off.
manage_firewall: false

# The nex user already has kubectl access on the master (/etc/sudoers.d/k3s-kubeconfig).
# With `true` the role would symlink and configure kubectl for the nex user on the master.
user_kubectl: false

# Must NOT be the default `~/.kube/config.new`. That name switches on two separate
# tasks of the role, which merge the master's kubeconfig into 109's own
# `~/.kube/config` as a context named `k3s-ansible` and make it active. They also
# rewrite the server address to `api_endpoint`, which is 192.168.1.101 - and that
# is NOT routable from 109 (`accept-routes` is deliberately false here). On
# 2026-08-24 the first live run broke kubectl on 109 in exactly this way.
#
# With any other value the role only copies the kubeconfig here and does not touch
# ~/.kube/config. The working context stays `default`, which goes over the
# Tailscale name: server: https://opt5060-i5:6443
kubeconfig: /root/.kube/k3s-ansible.yaml

# The IPv4 address of the on-site router. This is the NTP server of the nodes -
# IPv4, because the IPv6 link-local variant offered by DHCP is unreachable without
# an interface scope. Measured: with scope it answers in under 1 ms, without scope
# it times out.
ntp_server: 192.168.1.1
