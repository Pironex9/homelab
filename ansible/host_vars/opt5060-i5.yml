---
# The current ExecStart lines of /etc/systemd/system/k3s.service, verbatim.
# extra_server_args becomes the COMPLETE INSTALL_K3S_EXEC, which is why it starts
# with `server`.
#
# `--secrets-encryption` was added on 2026-08-28, by hand into the unit and here.
# Without it the next site.yml run would STRIP the flag. Having
# encryption-config.json under cred/ is not enough: k3s hands the file to the
# apiserver as --encryption-provider-config only because of this flag.
#
# Measured the same day on a throwaway cluster, without the flag: the server NEVER
# becomes ready, /readyz returns "[-]informer-sync failed" forever because the
# Secret informer cannot sync ("identity transformer tried to read encrypted
# data"). Non-Secret resources stay readable meanwhile, so at first glance it
# looks like it works.
extra_server_args: >-
  server
  --node-ip=192.168.1.101
  --advertise-address=192.168.1.101
  --flannel-iface=eno1
  --secrets-encryption
