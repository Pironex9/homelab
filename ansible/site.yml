---
# Wrapper around k3s.orchestration.site.
#
# Why it is needed: the collection only downloads /usr/local/bin/k3s-install.sh if
# the installed k3s version is older than the requested one, or if there is no k3s
# on the machine at all. The "Run K3s install script" task, however, runs
# UNCONDITIONALLY. On a cluster it did not install - ours was installed by hand
# from get.k3s.io, which leaves no copy at that path - this fails with
# "[Errno 2] No such file or directory: /usr/local/bin/k3s-install.sh".
# That is exactly what happened on the first live run on 2026-08-24.
#
# This does not make the installer re-download a binary: the role sets
# INSTALL_K3S_SKIP_DOWNLOAD to 'true' in this case, so the script only regenerates
# the systemd unit and the env file.
- name: Ensure the k3s install script is present
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tasks:
    - name: Download the K3s install script if it is missing
      ansible.builtin.get_url:
        url: https://get.k3s.io/
        timeout: 120
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"
        force: false

# ---------------------------------------------------------------------------
# NTP. Until 2026-08-28 no node was reliably in sync, and the master not at all:
# DHCP hands out the router's IPv6 LINK-LOCAL address as the NTP server, which is
# unreachable without an interface scope. The master's clock was 0.687 seconds
# fast because of this, with no correction - the fresh Prometheus stack found it.
#
# `FallbackNTP` did not save it: systemd only reaches for it if NO server is
# configured at all. One configured but dead server is enough to make sure the
# working fallback never gets its turn.
#
# This play exists here, rather than as a manual step, because a rebuilt node
# would otherwise go back to the broken server coming from DHCP. The collection
# does not manage NTP, hence a task of our own.
#
# The router's IPv4 address needs no scope, stays local (~1 ms), and brings in no
# internet dependency. Details: docs/hosts/k3s-cluster.md, "Clock synchronisation".
- name: Ensure the nodes have an NTP server that actually answers
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tasks:
    - name: Create the timesyncd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure an NTP server that needs no interface scope
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/10-router-ipv4.conf
        content: |
          [Time]
          NTP={{ ntp_server }}
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-timesyncd

  handlers:
    - name: Restart systemd-timesyncd
      ansible.builtin.systemd_service:
        name: systemd-timesyncd
        state: restarted

- name: Run the upstream k3s-ansible site playbook
  ansible.builtin.import_playbook: k3s.orchestration.site
