---
# Forgejo 16.0.3, rootless image, sqlite3, on a single Longhorn volume.
#
# WHY THE ROOTLESS VARIANT: the `apps` namespace enforces PSA at `baseline` level
# and warns at `restricted`. The rootless image starts with `USER 1000:1000` (from
# the v16.0.3 Dockerfile.rootless), so with the securityContext below the
# `restricted` warning goes silent too.
#
# ONE VOLUME IS ENOUGH. The docs describe two volumes (`/var/lib/gitea` +
# `/etc/gitea`), but in the v16.0.3 image `GITEA_APP_INI=/var/lib/gitea/custom/conf/app.ini`,
# so the config lives inside the data volume. A second mount would be redundant.
#
# The `FORGEJO__section__KEY` variables are rewritten into app.ini by
# `environment-to-ini` on EVERY start, so these are declarative. The plain variables
# of `docker-setup.sh` (DB_TYPE, ROOT_URL, INSTALL_LOCK) only matter on the first
# start, until the template is filled in - which is why we do not use those.
#
# strategy: Recreate is MANDATORY. The volume is ReadWriteOnce; a RollingUpdate would
# start the new pod next to the old one, and it would sit in Pending forever with a
# `Multi-Attach error`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        # The Longhorn volume is created root-owned. Without fsGroup uid 1000 could
        # not write into it, and docker-setup.sh would already fail on its first line
        # ("/var/lib/gitea/git is not writable").
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.3-rootless
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__server__DOMAIN
              value: forgejo.tailc6abe2.ts.net
            - name: FORGEJO__server__ROOT_URL
              value: https://forgejo.tailc6abe2.ts.net/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # Git-over-SSH is off: an Ingress only carries HTTP, and the tailnet HTTPS
            # clone works. If it is ever needed, the Tailscale operator's
            # `tailscale.com/expose` annotation can provide a separate TCP Service on
            # port 2222.
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            # NOT optional. If empty, Forgejo encrypts the 2FA secrets, the mirror
            # passwords and the OAuth tokens with the hardcoded value "!#@FDEWREWR&*("
            # (modules/setting/security.go, loadSecurityFrom). It is not generated
            # automatically. The Secret is not in git - the repo is public - it is
            # created by hand, see k8s/README.md.
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: SECRET_KEY
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # The liveness probe is deliberately TCP only. /api/healthz returns 503 for a
          # stalling database component as well, and wired to a liveness probe that
          # would push the pod into a restart loop instead of merely rotating it out
          # from behind the Service.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
