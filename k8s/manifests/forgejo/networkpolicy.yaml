---
# Forgejo's exception from the default-deny-ingress rule of the `apps` namespace.
# The deny itself sits in k8s/manifests/platform/namespace-apps.yaml; there is the
# namespace's rule, here is the application's own permission. If Forgejo is ever
# removed, this exception goes with it and the deny stays.
#
# THE ONLY THING THAT CAN REACH IT: the proxy pod generated by the Tailscale
# operator. We do not let the whole `tailscale` namespace through, but exactly the pod
# the operator created for THIS Ingress. The labels are put there by the operator and
# survive an Ingress re-creation - the pod NAME changes (ts-forgejo-99j4d-0), the
# parent-resource label does not.
#
# Measured on 2026-08-28, before the policy: NOT A SINGLE ServiceMonitor looks into
# the `apps` namespace, so Prometheus needs no exception. If a ServiceMonitor ever
# lands here, this rule is the first thing to extend, otherwise the target will
# silently go `down`.
#
# Argo CD is not listed here and does not need to be: it talks to the API server, not
# to the pods. Neither does Longhorn: volume attachment happens at node level.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-allow-tailscale-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: forgejo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: forgejo
              tailscale.com/parent-resource-ns: apps
              tailscale.com/parent-resource-type: ingress
      ports:
        - protocol: TCP
          port: 3000
