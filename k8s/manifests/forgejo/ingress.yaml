---
# https://forgejo.tailc6abe2.ts.net
#
# The same pattern as on the argocd Ingress: the Tailscale operator brings up a proxy
# pod that joins the tailnet as its own device and gets a real Let's Encrypt
# certificate. No cert-manager, no ClusterIssuer, no DNS record of our own.
#
# `ingressClassName` IS MANDATORY AND CANNOT BE OMITTED: `traefik` is the default
# IngressClass on this cluster, so if left out this Ingress would go to Traefik, which
# adds neither a certificate nor a tailnet name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: apps
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: forgejo
      port:
        number: 3000
  tls:
    - hosts:
        - forgejo
