---
# A cluster ELSO valodi kotete. Eddig 0 PVC volt, ezert ket dolog nem volt
# merheto rajta: a Longhorn visszaallitas a Garage S3-rol, es a drain
# last-replica aga. Mindketto ettol a kotettol indul.
#
# A `longhorn` az alapertelmezett StorageClass, de kiirjuk: a clusteren ott van a
# `local-path` is, es egy nema default-valtas nem vihet egy adatos kotetet a
# rossz provisionerre.
#
# Prune=false: az Argo CD `prune: true`-val fut. Enelkul ha ez a fajl kikerul a
# gitbol, az Argo CD torolne a PVC-t, a StorageClass `reclaimPolicy: Delete`
# pedig vinne a Longhorn kotetet is. A Deployment torlese olcso, ez nem az.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
