---
# The cluster's FIRST real volume. Until now there were 0 PVCs, so two things could
# not be measured on it: a Longhorn restore from Garage S3, and the last-replica
# branch of drain. Both start from this volume.
#
# `longhorn` is the default StorageClass, but we spell it out: `local-path` is also
# present on the cluster, and a silent default change must not move a data volume to
# the wrong provisioner.
#
# Prune=false: Argo CD runs with `prune: true`. Without this, if this file left git,
# Argo CD would delete the PVC, and the StorageClass `reclaimPolicy: Delete` would
# take the Longhorn volume with it. Deleting the Deployment is cheap, this is not.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
