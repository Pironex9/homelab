---
# https://longhorn.tailc6abe2.ts.net
#
# Until now the Longhorn UI was only reachable through `kubectl port-forward`, which
# is a process on 109 that dies together with the session. Same pattern as the argocd
# and forgejo Ingress: the Tailscale operator brings up a proxy pod with its own
# tailnet identity and a real Let's Encrypt certificate.
#
# `ingressClassName` cannot be omitted: `traefik` is the default IngressClass on this
# cluster.
#
# ---------------------------------------------------------------------------
# WARNING: THE LONGHORN UI HAS NO AUTHENTICATION.
#
# argocd and forgejo have their own login, this one does not. Anyone who reaches it
# can delete volumes and restore backups. The protection here is EXCLUSIVELY the
# tailnet: the Ingress is only reachable from inside the tailnet, and the tailnet
# consists of your own devices.
#
# Two things follow from that:
#   - this Ingress must NEVER go behind Pangolin or any other public path
#   - if a shared device ever joins the tailnet, this decision has to be revisited
#     (on the Tailscale side an ACL can narrow down which device can reach it)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: longhorn-frontend
      port:
        number: 80
  tls:
    - hosts:
        - longhorn
