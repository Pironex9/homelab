# The "default" group applies to every volume that does not name a recurring job of
# its own - that is, to everything unless we explicitly say otherwise.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  cron: "0 1 * * *"   # UTC, a 01:30-as k3s control-plane mentes ele
  task: backup
  groups:
    - default
  retain: 14
  concurrency: 1
