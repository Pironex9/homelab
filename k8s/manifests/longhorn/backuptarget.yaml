# Longhorn creates the empty "default" BackupTarget itself at install time, so Argo
# CD adopts this manifest (ServerSideApply=true) rather than creating it anew. We do
# not touch the Longhorn Helm release (longhorn/longhorn#6415).
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  # Garage S3 on LXC 100, over Tailscale. "garage" is the region name, not a
  # hostname. The endpoint and the keys are in the garage-backup-secret Secret.
  backupTargetURL: s3://longhorn@garage/
  credentialSecret: garage-backup-secret
  pollInterval: 5m0s
