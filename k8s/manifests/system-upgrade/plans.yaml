---
# K3s version upgrades with the system-upgrade-controller.
#
# The upgrade PATH is git: write the target version here, ArgoCD syncs it out, and the
# SUC runs it node by node. Neither ssh nor manual kubectl is needed.
#
# ONE MINOR AT A TIME. The 1.34 -> 1.36 jump is NOT supported, and the SUC does not
# protect against it either - it will happily run an invalid path. The order we go
# through:
#   v1.34.5+k3s1  ->  v1.34.11+k3s1   (patch, a trial of the SUC mechanics)
#   v1.34.11+k3s1 ->  v1.35.8+k3s1
#   v1.35.8+k3s1  ->  v1.36.4+k3s1
# After every hop: every node Ready on the new version, and the Longhorn disks Ready.
# Only then comes the next one.
#
# The `version` field carries `+k3s1`, from which the SUC builds a `-k3s1` image tag.
#
# WHERE TO TAKE THE VERSION NUMBER FROM. Not from the latest GitHub tag - from k3s's
# own channel:
#
#   curl -s https://update.k3s.io/v1-release/channels | jq -r '.data[] | "\(.id) \(.latest)"'
#
# Lesson from 2026-08-28: all three hops went one patch AHEAD of stable, because I
# took the newest existing tag as the target. The channel was at v1.34.10 / v1.35.7 /
# v1.36.3 at the time, and we went to v1.34.11 / v1.35.8 / v1.36.4. v1.36.4+k3s1 is
# `prerelease: true` on GitHub (2026-08-27), so upstream had not promoted it yet. It
# is neither an rc nor broken - but k3s does NOT support downgrades, so this cannot be
# taken back, only waited out.
#
# The rule: the target version should be in the matching channel. If you want
# something newer, let that be a deliberate decision, not a by-product.
#
# `drain` cordons first by itself, hence there is no separate `cordon: true` - the two
# together are redundant. The reasoning is below, above the drain block.
#
# The agent plan's `prepare` step waits until the server plan finishes. That order is
# mandatory: a worker must never get ahead of the control plane.
#
# WARNING: there is a single control plane. While the master is being upgraded the
# Kubernetes API is unreachable for a few minutes. That is not a fault, it is the
# price of a non-HA setup.
#
# ---------------------------------------------------------------------------
# DRAIN (since 2026-08-28, before that it was only `cordon: true`)
#
# The flags do not come from guesswork: a live `kubectl drain opt3050-i5` ran on the
# cluster with exactly these, and the critical line was in it:
#   pod/instance-manager-067cfdfdabf25fe0c8f8a8a0becb9fd3 evicted
#
# That was not incidental: Longhorn keeps a per-node PDB on the instance-manager pod,
# with `disruptionsAllowed: 0`, EVEN WITH ZERO VOLUMES. On top of that the pod is
# owned by an InstanceManager CR, not by a DaemonSet, so ignoreDaemonSets does NOT
# cover it.
#
# THE PDB DOES REJECT, AND THAT IS FINE BECAUSE OF THE RETRY. The same measurement
# repeated on a live volume (2026-08-28, Forgejo, 3 replicas) printed this:
#
#   error when evicting pods/"instance-manager-067..." -n "longhorn-system"
#   (will retry after 5s): Cannot evict pod as it would violate the pod's
#   disruption budget.
#
# Twice, then `evicted` on the third attempt. The mechanism is NOT that the cordon
# drops the PDB (this comment claimed that before, wrongly): Longhorn removes the PDB
# when no engine runs on the node any more - that is, after the workload's pod has
# left and the volume has detached. Until then the eviction API rejects, as designed.
# The 5 second retry loop of `kubectl drain` absorbs the difference. After uncordon
# all three PDBs came back on their own.
#
# THIS IS WHY `timeout` IS NOT COSMETIC. A tight timeout would die in exactly that
# window, and it would look as if the drain had stalled. On an empty cluster this step
# passed on the first try, so a tight timeout would not even have failed there - on a
# live volume the PDB window is ~10 seconds. Measured times on a live volume: drain
# 12s, the workload served again 42s later on another node, the third replica rebuilt
# 37s after uncordon.
#
# The value of `node-drain-policy` must NOT be `block-for-eviction` - that blocks until
# every replica has been rebuilt elsewhere, and with 3 nodes and 3 replicas there is
# nowhere to go, so it would hang forever with a cordoned node. The default
# `block-if-contains-last-replica` is the correct one, and it was measured on a live
# volume on 2026-08-28: draining one node out of three leaves 2 healthy replicas,
# nothing blocked, the volume went degraded and then rebuilt.
# ---------------------------------------------------------------------------
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    timeout: 300s
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.36.4+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    timeout: 300s
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    args:
      - prepare
      - server-plan
    image: rancher/k3s-upgrade
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.36.4+k3s1
