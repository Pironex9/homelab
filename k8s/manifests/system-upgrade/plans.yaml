---
# K3s verziofrissites a system-upgrade-controllerrel.
#
# A frissites UTJA a git: ide irod a cel verziot, az ArgoCD kiszinkronizalja, a
# SUC pedig node-onkent lefuttatja. Nem kell sem ssh, sem kezi kubectl.
#
# EGYSZERRE EGY MINORT. A 1.34 -> 1.36 ugras NEM tamogatott, es a SUC nem is
# ved ellene - simán lefuttat egy ervenytelen utat. A sorrend, amit vegigviszunk:
#   v1.34.5+k3s1  ->  v1.34.11+k3s1   (patch, a SUC mechanika probaja)
#   v1.34.11+k3s1 ->  v1.35.8+k3s1
#   v1.35.8+k3s1  ->  v1.36.4+k3s1
# Minden hop utan: minden node Ready az uj verzioval, es a Longhorn lemezek
# Ready-k. Csak utana jon a kovetkezo.
#
# A `version` mezoben `+k3s1` all, a SUC ebbol keszit `-k3s1` image tagot.
#
# A `drain` maga cordonol elsokent, ezert nincs kulon `cordon: true` - a ketto
# egyutt felesleges. Az indoklas lentebb, a drain blokk felett.
#
# Az agent-plan `prepare` lepese megvarja, amig a server-plan vegez. Ez a
# sorrend kotelezo: a worker sosem elozheti meg a control plane-t.
#
# FIGYELEM: egyetlen control plane van. A master frissitese alatt a Kubernetes
# API nehany percig elerhetetlen. Ez nem hiba, hanem a nem-HA setup ara.
#
# ---------------------------------------------------------------------------
# DRAIN (2026-08-28 ota, elotte csak `cordon: true` volt)
#
# A flagek nem talalgatasbol jonnek: pontosan ezekkel futott le egy eles
# `kubectl drain opt3050-i5` a clusteren, es a kritikus sor benne volt:
#   pod/instance-manager-067cfdfdabf25fe0c8f8a8a0becb9fd3 evicted
#
# Ez azert nem volt maganyos: a Longhorn node-onkent tart egy PDB-t az
# instance-manager podra, `disruptionsAllowed: 0`-val, MEG NULLA KOTET MELLETT
# IS. A pod ráadásul InstanceManager CR tulajdona, nem DaemonSete, tehat az
# ignoreDaemonSets NEM fedi.
#
# A PDB VALOBAN ELUTASIT, ES EZ A RETRY MIATT NEM BAJ. Ugyanez a meres eles
# koteten megismetelve (2026-08-28, Forgejo, 3 replika) ezt irta ki:
#
#   error when evicting pods/"instance-manager-067..." -n "longhorn-system"
#   (will retry after 5s): Cannot evict pod as it would violate the pod's
#   disruption budget.
#
# Ketszer, majd a harmadik probara `evicted`. A mechanizmus NEM az, hogy a
# cordon eldobja a PDB-t (ezt allitotta korabban ez a komment, tevesen): a
# Longhorn akkor veszi ki a PDB-t, amikor a node-on mar nem fut engine - vagyis
# miutan a workload podja tavozott es a kotet lecsatolt. Addig az eviction API
# szabalyosan elutasit. A `kubectl drain` 5 masodperces retry hurka nyeli el a
# kulonbseget. Uncordon utan mindharom PDB magatol visszajott.
#
# EZERT NEM KOZMETIKA A `timeout`. Egy szuk timeout pont ebben az ablakban
# halna meg, es ugy nezne ki, mintha a drain elakadt volna. Ures clusteren ez
# a lepes elsore atment, tehat a szuk timeout ott nem is bukott volna meg -
# eles koteten viszont ~10 masodperc a PDB-ablak. Mert idok eles koteten:
# drain 12s, a workload 42s mulva szolgalt ki ujra masik node-on, a harmadik
# replika ujraepulese uncordon utan 37s.
#
# A `node-drain-policy` erteke NEM lehet `block-for-eviction` - az addig
# blokkol, amig minden replika ujraepult mashol, es 3 node + 3 replika mellett
# nincs hova, tehat orokre logna egy cordonolt node-dal. Az alapertelmezett
# `block-if-contains-last-replica` a helyes, es 2026-08-28-an eles koteten
# meg is lett merve: 3-bol egy node drainje 2 ep replikat hagy, semmi nem
# blokkolt, a kotet degraded lett majd ujraepult.
# ---------------------------------------------------------------------------
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    timeout: 300s
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.36.4+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    timeout: 300s
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    args:
      - prepare
      - server-plan
    image: rancher/k3s-upgrade
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.36.4+k3s1
