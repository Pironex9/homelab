---
# The Argo CD web UI on the tailnet, with its own MagicDNS name and an automatically
# managed Tailscale TLS certificate:
#
#   https://argocd.tailc6abe2.ts.net
#
# For every Ingress with `ingressClassName: tailscale` the Tailscale operator brings
# up a separate proxy pod that joins the tailnet as its own device. The name is built
# from spec.tls[0].hosts[0] and the tailnet domain.
#
# IMPORTANT: argocd-server runs with `server.insecure: "true"` (argocd-cmd-params-cm).
# Without it Argo CD would speak HTTPS itself and would run into an endless redirect
# loop behind any TLS-terminating Ingress. That setting does NOT live in this repo,
# because neither does Argo CD's own installation - see k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
  tls:
    - hosts:
        - argocd
