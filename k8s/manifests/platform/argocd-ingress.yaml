---
# Az Argo CD webfelulete a tailneten, sajat MagicDNS nevvel es automatikusan
# kezelt Tailscale TLS tanusitvannyal:
#
#   https://argocd.tailc6abe2.ts.net
#
# A Tailscale operator minden `ingressClassName: tailscale` Ingresshez felvesz egy
# kulon proxy podot, ami sajat eszkozkent csatlakozik a tailnethez. A nev a
# spec.tls[0].hosts[0] ertekebol es a tailnet domainbol all ossze.
#
# FONTOS: az argocd-server `server.insecure: "true"`-val fut (argocd-cmd-params-cm).
# Enelkul az Argo CD sajat maga is HTTPS-t beszelne, es barmely TLS-t termnalo
# Ingress mogott vegtelen atiranyitasi hurokba futna. Ez a beallitas NEM ebben a
# repoban el, mert az Argo CD sajat telepitese sem - lasd k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
  tls:
    - hosts:
        - argocd
