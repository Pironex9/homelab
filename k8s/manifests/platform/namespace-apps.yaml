---
# The landing namespace for our own workloads. kube-system and longhorn-system get no
# PSA label: those are system components, and `baseline` would break more in them than
# it is worth.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    # Enforce at `baseline` level: it forbids privileged containers, hostPath, host
    # networking and host namespaces. `restricted` deliberately only warns, because
    # that would also require a seccomp profile and non-root execution, which many
    # off-the-shelf images do not meet.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
# Default requests and limits for every pod that does not bring its own. According to
# the audit all 35 pods ran without limits: because of that the scheduler sees no real
# demand, and a single runaway pod can starve the node.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: apps
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
# Default deny for INBOUND traffic. Without it any pod in the cluster can reach the
# applications running here directly, bypassing the Service and the Ingress.
#
# Ingress only: outbound traffic is deliberately left open. Forgejo needs DNS, and
# later a git remote, a webhook or an avatar fetch may come too - an egress deny would
# break more now than it would protect.
#
# THE KUBELET PROBES DO PASS THROUGH THIS, and that is measured, not assumed. Per
# k3s-io/k3s#10030 a default-deny killed the liveness and readiness probes; on this
# version (v1.36.4+k3s1, built-in kube-router v2.6.3-k3s1) it was measured on
# 2026-08-28 in a throwaway namespace that the pod stayed Ready for 60 seconds, with a
# 5 second probe period and a threshold of 2. If after some future k3s upgrade a pod
# turns NotReady ~10 seconds after the policy is applied, this is the first place to
# look.
#
# What is ALLOWED THROUGH sits in Forgejo's own NetworkPolicy, in
# k8s/manifests/forgejo/networkpolicy.yaml - so that a new application does not ask
# for permission for itself from this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
