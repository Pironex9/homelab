---
# App-of-apps root. This is the ONLY object that has to be created by hand;
# everything else reaches the cluster through it, from git.
#
#   kubectl apply -f k8s/bootstrap/root-app.yaml
#
# It picks up and keeps in sync every Application placed under k8s/apps/. Because
# of the finalizer, deleting the root takes the children with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pironex9/homelab.git
    targetRevision: main
    path: k8s/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
