---
# kube-prometheus-stack: Prometheus + Grafana + Alertmanager + node-exporter +
# kube-state-metrics, under Argo CD, from a Helm source. The values live here in
# git, so there is no `helm upgrade --set` oral tradition.
#
# The chart version is exact, not `*`. Between 88.6.0 (2026-08-27) and 88.5.4 there
# is a single PR (HTTPRoute timeout), so this is not a fresh major change.
#
# ---------------------------------------------------------------------------
# WHAT HAS TO BE TURNED OFF ON K3S, AND WHY
#
# By default the chart also wants to scrape four control-plane components. On k3s
# these are not separate pods but run inside the same k3s process, and their metric
# ports are bound to LOOPBACK on the master - measured on 2026-08-28:
#
#   LISTEN 127.0.0.1:10257   kube-controller-manager
#   LISTEN 127.0.0.1:10259   kube-scheduler
#   LISTEN 127.0.0.1:10249   kube-proxy
#   (2381 does not even exist: the datastore is kine + sqlite, there is no etcd at all)
#
# These are unreachable from a pod, so the ServiceMonitors would show `down`
# forever and their alerts would fire continuously. The chart's suggested
# `jobNameOverride: k3s-server` does NOT help with this - it only fixes the
# dashboard labels, not reachability.
#
# The kubelet stays enabled: 10250 listens on `*`, so it is reachable.
#
# If they are ever needed: k3s `--kube-controller-manager-arg=bind-address=0.0.0.0`
# and friends open them up - but that exposes the control-plane metrics to the
# network, so it is a separate decision, not something to settle in passing.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.0
    helm:
      values: |
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheus:
          prometheusSpec:
            # Without this every alert ends in "on cluster ." - the text refers to
            # the `cluster` label, which is empty. Measured on the first real alerts
            # on 2026-08-28. It is also useful if more than one source ever ends up
            # in the same Prometheus or Grafana.
            externalLabels:
              cluster: homelab-k3s
            # 15 days and 15 GiB - whichever comes first. retentionSize has to stay
            # below the PVC size, otherwise the TSDB fills the volume instead of
            # trimming itself.
            retention: 15d
            retentionSize: "15GiB"
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: "1"
                memory: 2Gi

        alertmanager:
          # No PVC: its state is silences, which are lost on a restart.
          alertmanagerSpec:
            # The COMPLETE alertmanager.yaml comes from a hand-made Secret, because
            # it contains two secrets (bot token + chat id) and the repo is public.
            # The template is in k8s/README.md so it stays reproducible.
            #
            # Why Telegram and not ntfy, the homelab's usual channel: the cluster is
            # at the OTHER site and cannot reach 192.168.0.208. Measured from both a
            # node and a pod: HTTP 000, because the route to 192.168.0.0/24 leaves
            # through the local gateway, there is no subnet route homewards.
            # api.telegram.org, on the other hand, is reachable from the cluster (measured).
            configSecret: alertmanager-telegram
            # Without this the chart would ALSO generate its own Secret holding a
            # default config (alertmanager-monitoring-kube-prometheus-...). The
            # operator would not use it, but it would sit there, and anyone reading it
            # while debugging would think THAT is the running config. This switch is
            # the counterpart of configSecret.
            useExistingSecret: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        grafana:
          admin:
            # Hand-created Secret, because the repo is public. See k8s/README.md.
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # MANDATORY alongside persistence, and it was missed the first time. The
          # chart defaults to RollingUpdate; on an RWO volume the new pod waits
          # forever with `FailedAttachVolume` for the old one, and the old one never
          # shuts down because the new one never becomes Ready. On 2026-08-28 it stood
          # like this for 25 minutes:
          #
          #   Waiting for detach for volume "pvc-8d6accc7..."
          #   Volume is already used by pod(s) monitoring-grafana-765dcb66d6-fwt9j
          #
          # The same trap as on the Forgejo Deployment. Anything with an RWO volume
          # runs with Recreate.
          deploymentStrategy:
            type: Recreate
          persistence:
            # The chart's dashboards come from ConfigMaps and survive without this.
            # This carries hand-made dashboards and settings across a pod restart.
            enabled: true
            type: pvc
            storageClassName: longhorn
            size: 5Gi
          ingress:
            # https://grafana.tailc6abe2.ts.net
            # With an empty `hosts` the chart generates a rule without a host and
            # passes the `tls` block through unchanged - exactly the shape the
            # Tailscale operator expects (see the argocd and forgejo Ingress).
            enabled: true
            ingressClassName: tailscale
            hosts: []
            tls:
              - hosts:
                  - grafana
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # It was 512Mi, and Grafana measured out at 405Mi - 79% of the limit.
              # It was stable, not creeping, but an OOMKill here is a silent failure:
              # the pod restarts, the dashboards come back, and nothing tells you why
              # there was a hole in the graphs. The `apps` namespace LimitRange does
              # not reach here, `monitoring` is its own namespace.
              memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The `monitoring` namespace deliberately gets NO PSA label, unlike `apps`:
      # node-exporter uses hostNetwork and hostPath, which `baseline` would reject.
      - CreateNamespace=true
      # The chart's CRDs are large. With a client-side apply the whole manifest would
      # go into an annotation and hit the 256 KB limit - the same failure that came up
      # first during Argo CD's own installation.
      - ServerSideApply=true
