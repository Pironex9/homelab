---
# The system-upgrade-controller and the k3s upgrade Plans.
#
# The controller and the CRD are copied from the upstream v0.20.1 release
# (k8s/manifests/system-upgrade/{crd,controller}.yaml), unmodified. To upgrade,
# pull those two files again from the next release.
#
# ServerSideApply: the CRD is 72 KB, which still fits into the 256 KB client-side
# apply annotation limit today, but for a CRD server-side apply is the correct
# choice anyway - the same decision as on the longhorn-backup Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pironex9/homelab.git
    targetRevision: main
    path: k8s/manifests/system-upgrade
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
