name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned below 10 on purpose. Material for MkDocs goes EOL on 2026-11-05
      # and MkDocs 2.0 drops the plugin system, the theming system and YAML
      # config, so Material cannot run on it. Material 9.x already caps its own
      # dependency at mkdocs<2, so this one constraint holds the whole build.
      # Review in November 2026: the migration target is Zensical.
      - name: Install MkDocs + Material
        run: pip install "mkdocs-material<10"

      - name: Build site
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
        id: deployment
