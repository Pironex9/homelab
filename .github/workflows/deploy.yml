name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned below 10 on purpose. Material for MkDocs goes EOL on 2026-11-05
      # and MkDocs 2.0 drops the plugin system, the theming system and YAML
      # config, so Material cannot run on it. Material 9.x already caps its own
      # dependency at mkdocs<2, so this one constraint holds the whole build.
      # Review in November 2026: the migration target is Zensical.
      - name: Install MkDocs + Material
        run: pip install "mkdocs-material<10"

      # brand/ holds the only committed copy of each font, but MkDocs cannot
      # read outside docs_dir without a plugin, so this one copy has to exist.
      # A stale .woff2 is invisible in a diff, so review is not a control here
      # - this is. See docs/adr/0002-brand-values-are-duplicated-not-shared.md
      - name: Verify the docs font copies match brand/
        run: |
          for f in ibm-plex-sans-var ibm-plex-mono-400 ibm-plex-mono-500; do
            cmp "brand/$f.woff2" "docs/assets/fonts/$f.woff2" \
              || { echo "docs/assets/fonts/$f.woff2 differs from brand/$f.woff2"; exit 1; }
          done

      - name: Build site
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
        id: deployment
