site_name: Norbert Csicsay - Homelab
site_description: Self-hosted infrastructure running 32 Docker Compose stacks and a 3-node K3s cluster on Proxmox VE. Built from scratch to learn Linux, networking, and DevOps practices.
site_author: Norbert Csicsay
site_url: https://docs.homelabor.net/

# Internal working documents. They live under docs/ so they sit beside the
# material they describe, but they are not part of the published portfolio:
# they name services and reasoning meant for me, not for a visitor. Leaving
# them out of `nav` was not enough - MkDocs still built them, listed them in
# sitemap.xml and indexed them for the site search.
exclude_docs: |
  superpowers/
  adr/
  README.md

# `README.md` is not an internal document: it is the index of docs/ for anyone
# reading the repo on GitHub, and it is kept in step with `nav` by hand. MkDocs
# drops it from the build anyway because `index.md` already claims that URL, but
# it does so with a warning, which `--strict` turns into a failed deploy. Naming
# it here makes the exclusion deliberate instead of incidental.

# `--strict` in the deploy workflow turns each of these into a build failure, so
# a broken link cannot reach the published site. `warn` rather than `ignore` is
# what gives them something to escalate; `anchors` is the one that catches a
# heading rename breaking a `#fragment` somewhere else in the tree.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

repo_url: https://github.com/Pironex9/homelab
repo_name: Pironex9/homelab

docs_dir: docs
theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  # Stops Material fetching Roboto from Google Fonts. The faces are then set
  # through --md-text-font and --md-code-font in stylesheets/extra.css. This
  # site links from a landing page whose argument is that it is self-hosted
  # end to end; a Google Fonts request here contradicts it directly.
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Pironex9
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/norbert-csicsay-497195334

